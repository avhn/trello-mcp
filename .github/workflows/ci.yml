name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned MCPB tooling
        run: npm ci --prefix packaging/mcpb --ignore-scripts --no-audit --no-fund
      - name: Test bundle and future registry assembly
        run: |
          python3 -I tests/package_mcpb_test.py
          python3 -I tests/release_manifest_test.py
      - name: Validate metadata-only template with checksum-pinned publisher v1.8.1
        run: python3 -I scripts/release_manifest.py publisher-validate

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate static site, docs mirror and versions
        run: |
          python3 -I scripts/site/validate.py --self-test
          python3 -I scripts/site/validate.py
          python3 -I scripts/site/generate_social.py --check

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Test installer with PowerShell 7
        shell: pwsh
        run: pwsh -NoProfile -File tests/install_test.ps1
      - name: Test installer with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install_test.ps1

  windows-auth:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Test credentials and auth with Windows DACLs
        run: go test ./internal/credentials/... ./internal/auth/...

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            gofmt -d .
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      - name: Test with race detector
        run: go test -race ./...
      - name: Build
        run: go build ./...
