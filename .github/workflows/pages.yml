name: pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site/**'
      - 'README.md'
      - 'docs/**'
      - 'LICENSE'
      - 'packaging/registry/server.template.json'
      - 'internal/tools/health.go'
      - 'internal/tools/registry.go'
      - 'internal/tools/delivery.go'
      - 'internal/credentials/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate static site
        run: |
          python3 -I scripts/site/validate.py --self-test
          python3 -I scripts/site/validate.py
          python3 -I scripts/site/generate_social.py --check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
