# Canonical golangci-lint config (v2 schema). Copy as .golangci.yml.
# Regenerate with `golangci-lint migrate` on schema changes.
version: '2'

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck # unchecked errors
    - govet # suspicious constructs
    - staticcheck # includes the former gosimple and stylecheck
    - unused
    - ineffassign
    - gocritic # opinionated style checks
    - revive # replaces golint
    - misspell
    - prealloc
    - bodyclose # HTTP body close checks
    - sqlclosecheck
    - contextcheck
  settings:
    revive:
      rules:
        - name: exported
          arguments: [checkPrivateReceivers]
        - name: unexported-return
        - name: error-return
